<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Caisse Septors</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/vue@3"></script>
</head>

<body>

<div id="app">

  <!-- HEADER -->
  <div class="header">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      
      <div>
        <img src="logo.png" class="logo">
        Septors - Caisse Buvette
      </div>

      <!-- ⚙️ MENU -->
      <div class="gear-container" ref="menuContainer">
        <div class="gear" @click="toggleMenu">⚙️</div>

        <div v-if="showMenu" class="admin-menu">
          <button @click="goConfig">Configuration</button>
          <button @click="refreshPage">🔄 Rafraîchir</button>
        </div>
      </div>

    </div>
  </div>

  <!-- CONTENU -->
  <div class="container">

    <!-- PRODUITS -->
    <div class="products">

      <div v-for="p in products"
           class="product"
           :class="{ out: p.out_of_stock }"
           @click="addToCart(p)">

        <h3>{{ p.name }}</h3>
        <p>{{ p.price }} €</p>
        <div class="stock">Stock : {{ p.stock }}</div>

        <!-- quantité -->
        <div class="qty" v-if="cartItem(p)">
          x{{ cartItem(p).qty }}
        </div>

      </div>

    </div>

    <!-- PANIER -->
    <div class="cart">

      <!-- HEADER PANIER -->
      <div class="cart-header">
        <h2>Panier</h2>

        <button v-if="cart.length > 0"
                class="edit-btn"
                @click="editMode = !editMode">
          {{ editMode ? "✔️ Terminer" : "✏️ Modifier" }}
        </button>
      </div>

      <!-- ITEMS -->
      <div v-for="item in cart" class="cart-item">

        <div>{{ item.name }}</div>

        <div class="cart-controls">

          <button v-if="editMode" @click="removeFromCart(item)">➖</button>

          <span>x{{ item.qty }}</span>

          <button v-if="editMode" @click="addToCart(item)">➕</button>

        </div>

        <span>{{ (item.price * item.qty).toFixed(2) }} €</span>

      </div>

      <!-- TOTAL -->
      <div class="total">
        Total : {{ total }} €
      </div>

      <button class="card" @click="pay('card')">💳 Carte</button>
      <button class="cash" @click="payCash">💵 Espèces</button>
    </div>

  </div>
</div>

<script>
  
const { createApp } = Vue;

createApp({
  data() {
    return {
      products: [],
      cart: [],
      showMenu: false,
      editMode: false
    }
  },

  computed: {
    total() {
      return this.cart.reduce((sum, item) => sum + item.price * item.qty, 0).toFixed(2);
    }
  },

  methods: {
    async loadProducts() {
      const res = await fetch("/products");
      this.products = await res.json();
    },

    refreshPage() {
      location.reload();
    },

    cartItem(product) {
      return this.cart.find(c => c.id === product.id);
    },

    addToCart(product) {
      if (product.out_of_stock) {
        alert("Produit en rupture ❌");
        return;
      }

      const existing = this.cart.find(p => p.id === product.id);

      if (existing) {
        existing.qty++;
      } else {
        this.cart.push({ ...product, qty: 1 });
      }
    },

    removeFromCart(product) {
      const existing = this.cart.find(p => p.id === product.id);
      if (!existing) return;

      existing.qty--;

      if (existing.qty <= 0) {
        this.cart = this.cart.filter(p => p.id !== product.id);
      }
    },

    async pay(type) {
      if (this.cart.length === 0) return;

      // 👉 confirmation uniquement pour carte
      if (type === "card") {
        const ok = confirm("Paiement CB effectué ?");
        if (!ok) return;
      }

      await fetch("/sales", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          total: this.total,
          payment: type,
          items: this.cart
        })
      });

  alert("Paiement validé !");
  this.cart = [];
  location.reload();
},

    payCash() {
      const amount = prompt("Montant donné ?");
      if (!amount) return;

      const change = amount - this.total;
      alert("Rendu : " + change.toFixed(2) + " €");

      this.pay("cash");
    },

    toggleMenu(event) {
      event.stopPropagation();
      this.showMenu = !this.showMenu;
    },

    handleClickOutside(event) {
      const menu = this.$refs.menuContainer;
      if (menu && !menu.contains(event.target)) {
        this.showMenu = false;
      }
    },

    async goConfig() {
      const password = prompt("Mot de passe admin ?");
      if (!password) return;

      const res = await fetch("/admin/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ password })
      });

      if (res.ok) {
        window.location.href = "/admin.html?pwd=" + password;
      } else {
        alert("Mot de passe incorrect");
      }
    }
  },

  mounted() {
    this.loadProducts();
    document.addEventListener("click", this.handleClickOutside);
  },

  unmounted() {
    document.removeEventListener("click", this.handleClickOutside);
  }

}).mount("#app");
</script>

</body>
</html>
