<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
<script src="https://unpkg.com/vue@3"></script>
</head>

<body>
<div id="app" class="admin">

<h1>🏪 Gestion des produits</h1>

<div class="add-box">

  <select v-model="newProduct.category">
    <option value="drink">🥤 Boisson</option>
    <option value="food">🍔 Food</option>
    <option value="candy">🍬 Confiserie</option>
    <option value="snack">🥨 Apéro</option>
    <option value="other">📦 Autre</option>
  </select>

  <input v-model="newProduct.name" placeholder="Nom">

  <input v-model.number="newProduct.price" type="number" inputmode="decimal" placeholder="Prix €">
  <input v-model.number="newProduct.stock" type="number" inputmode="numeric" placeholder="Stock">

  <button @click="addProduct">➕ Ajouter</button>
</div>

<div class="product-list">

  <div v-for="(p, index) in products" class="admin-product">

    <div class="move-buttons">
      <button @click="moveUp(index)">⬆️</button>
      <button @click="moveDown(index)">⬇️</button>
    </div>

    <input v-model="p.name">

    <div class="row">

      <div class="input-box price-box">
        <label>Prix</label>
        <input v-model.number="p.price" type="number" inputmode="decimal">
        <span class="suffix">€</span>
      </div>

      <div class="input-box stock-box">
        <label>Stock</label>
        <input v-model.number="p.stock" type="number" inputmode="numeric">
        <span class="suffix">unités</span>
      </div>

    </div>

    <select v-model="p.category">
      <option value="drink">🥤</option>
      <option value="food">🍔</option>
      <option value="candy">🍬</option>
      <option value="snack">🥨</option>
      <option value="other">📦</option>
    </select>

    <div class="rupture-row">
      <span class="rupture-label">Rupture</span>

      <label class="switch-ios">
        <input type="checkbox" v-model="p.out_of_stock">
        <span class="slider-ios"></span>
      </label>
    </div>

    <button class="delete" @click="deleteProduct(p.id)">🗑️</button>

  </div>

  <div class="admin-actions">
    <button class="save-all" @click="saveAll">💾 Sauvegarder</button>
    <button class="refresh" @click="loadProducts">🔄 Rafraîchir</button>

    <button class="session-btn"
            :class="{ active: sessionActive }"
            @click="toggleSession">

      {{ sessionActive ? "⏹ Stop caisse" : "▶️ Lancer caisse" }}

    </button>
  </div>

</div>

</div>

<script>
const ADMIN_PWD = new URLSearchParams(window.location.search).get("pwd");
const { createApp } = Vue;

createApp({
data(){
  return{
    products:[],
    newProduct:{name:"",price:null,stock:null,category:"drink"},
    sessionActive: false
  }
},

methods:{

async getSessionStatus(){
  const res = await fetch("/session/status");
  const data = await res.json();
  this.sessionActive = data.active;
},

async toggleSession(){

  if (!this.sessionActive) {

    await fetch("/session/start", { method: "POST" });
    this.sessionActive = true;

    alert("🟢 Caisse lancée");

  } else {

    const res = await fetch("/session/stop", { method: "POST" });
    const data = await res.json();

    this.sessionActive = false;

    // 🔥 téléchargement automatique
    const blob = new Blob([data.content], { type: "text/plain" });
    const url = window.URL.createObjectURL(blob);

    const a = document.createElement("a");
    a.href = url;
    a.download = "rapport_caisse.txt";
    a.click();

    window.URL.revokeObjectURL(url);

    alert("📄 Rapport téléchargé");
  }

},

async loadProducts(){
  const r = await fetch("/products");
  const data = await r.json();

  this.products = data.map(p => ({
    ...p,
    out_of_stock: p.stock <= 0 ? true : Boolean(p.out_of_stock)
  }));
},

addProduct(){
  this.products.push({
    id: "new_" + Date.now(),
    name: this.newProduct.name,
    price: this.newProduct.price,
    stock: this.newProduct.stock,
    category: this.newProduct.category,
    out_of_stock: 0,
    isNew: true
  });

  this.newProduct = {name:"",price:0,stock:0,category:"drink"};
},

moveUp(index){
  if(index === 0) return;
  const temp = this.products[index];
  this.products[index] = this.products[index - 1];
  this.products[index - 1] = temp;
},

moveDown(index){
  if(index === this.products.length - 1) return;
  const temp = this.products[index];
  this.products[index] = this.products[index + 1];
  this.products[index + 1] = temp;
},

async saveAll(){

  for(let i = 0; i < this.products.length; i++){

    const p = this.products[i];

    const payload = {
      name: p.name,
      price: p.price,
      stock: p.stock,
      category: p.category,
      out_of_stock: p.out_of_stock ? 1 : 0,
      position: i
    };

    if (p.isNew) {

      await fetch("/products", {
        method: "POST",
        headers: {
          "Content-Type":"application/json",
          "x-admin-password": ADMIN_PWD
        },
        body: JSON.stringify(payload)
      });

    } else {

      await fetch("/products/" + p.id, {
        method:"PUT",
        headers:{
          "Content-Type":"application/json",
          "x-admin-password":ADMIN_PWD
        },
        body: JSON.stringify(payload)
      });

    }
  }

  alert("✅ Sauvegardé");
  this.loadProducts();
},

async deleteProduct(id){
  if(!confirm("Supprimer ?")) return;

  await fetch("/products/" + id, {
    method:"DELETE",
    headers:{"x-admin-password":ADMIN_PWD}
  });

  this.loadProducts();
}

},

mounted(){
  this.loadProducts();
  this.getSessionStatus(); // 🔥 IMPORTANT
}

}).mount("#app");
</script>
</body>
</html>
