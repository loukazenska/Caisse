<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
<script src="https://unpkg.com/vue@3"></script>
</head>

<body>
<div id="app" class="admin">

<h1>🏪 Gestion des produits</h1>

<div class="add-box">

  <select v-model="newProduct.category">
    <option value="drink">🥤 Boisson</option>
    <option value="food">🍔 Food</option>
    <option value="candy">🍬 Confiserie</option>
    <option value="snack">🥨 Apéro</option>
    <option value="other">📦 Autre</option>
  </select>

  <input v-model="newProduct.name" placeholder="Nom">

  <input v-model.number="newProduct.price" type="number" inputmode="decimal" placeholder="Prix €">
  <input v-model.number="newProduct.stock" type="number" inputmode="numeric" placeholder="Stock">

  <button @click="addProduct">➕ Ajouter</button>
</div>

<div class="product-list">

  <div v-for="(p, index) in products" class="admin-product">

    <!-- 🔼🔽 MOVE -->
    <div class="move-buttons">
      <button @click="moveUp(index)">⬆️</button>
      <button @click="moveDown(index)">⬇️</button>
    </div>

    <input v-model="p.name">

    <div class="row">
      <input v-model.number="p.price" type="number" inputmode="decimal">
      <input v-model.number="p.stock" type="number" inputmode="numeric">
    </div>

    <select v-model="p.category">
      <option value="drink">🥤</option>
      <option value="food">🍔</option>
      <option value="candy">🍬</option>
      <option value="snack">🥨</option>
      <option value="other">📦</option>
    </select>

    <label class="checkbox">
      <input type="checkbox"
       :checked="p.out_of_stock || p.stock <= 0"
       @change="p.out_of_stock = $event.target.checked">
    </label>

    <button class="delete" @click="deleteProduct(p.id)">🗑️</button>
  </div>

  <div class="admin-actions">
  <button class="save-all" @click="saveAll">💾 Sauvegarder</button>
  <button class="refresh" @click="loadProducts">🔄 Rafraîchir</button>
</div>

</div>

</div>

<script>
const ADMIN_PWD = new URLSearchParams(window.location.search).get("pwd");
const { createApp } = Vue;

createApp({
data(){
  return{
    products:[],
    newProduct:{name:"",price:0,stock:0,category:"drink"}
  }
},

methods:{

async loadProducts(){
  const r = await fetch("/products");
  const data = await r.json();

  // 🔥 sync checkbox avec stock réel
  this.products = data.map(p => ({
    ...p,
    out_of_stock: p.stock <= 0 ? 1 : p.out_of_stock
  }));
},

addProduct(){
  this.products.push({
    id: "new_" + Date.now(),
    name: this.newProduct.name,
    price: this.newProduct.price,
    stock: this.newProduct.stock,
    category: this.newProduct.category,
    out_of_stock: 0,
    isNew: true
  });

  this.newProduct = {name:"",price:0,stock:0,category:"drink"};
},

// 🔼
moveUp(index){
  if(index === 0) return;
  const temp = this.products[index];
  this.products[index] = this.products[index - 1];
  this.products[index - 1] = temp;
},

// 🔽
moveDown(index){
  if(index === this.products.length - 1) return;
  const temp = this.products[index];
  this.products[index] = this.products[index + 1];
  this.products[index + 1] = temp;
},

async saveAll(){

  for(let i = 0; i < this.products.length; i++){

    const p = this.products[i];

    const payload = {
      name: p.name,
      price: p.price,
      stock: p.stock,
      category: p.category,
      out_of_stock: p.out_of_stock,
      position: i
    };

    if (p.isNew) {

      await fetch("/products", {
        method: "POST",
        headers: {
          "Content-Type":"application/json",
          "x-admin-password": ADMIN_PWD
        },
        body: JSON.stringify(payload)
      });

    } else {

      await fetch("/products/" + p.id, {
        method:"PUT",
        headers:{
          "Content-Type":"application/json",
          "x-admin-password":ADMIN_PWD
        },
        body: JSON.stringify(payload)
      });

    }
  }

  alert("✅ Ordre sauvegardé");
  this.loadProducts();
},

async deleteProduct(id){
  if(!confirm("Supprimer ?")) return;

  await fetch("/products/" + id, {
    method:"DELETE",
    headers:{"x-admin-password":ADMIN_PWD}
  });

  this.loadProducts();
}

},

mounted(){
  this.loadProducts();
}

}).mount("#app");
</script>
</body>
</html>
